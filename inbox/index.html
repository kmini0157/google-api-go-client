<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0f" />
  <title>Inbox — your AI read-it-later</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./styles.css" />
  <!-- Puter.js: key-free client-side LLM for summaries + tags -->
  <script src="https://js.puter.com/v2/"></script>
</head>
<body>
  <div id="app">
    <header>
      <h1>📥 Inbox</h1>
      <button id="signout" class="ghost hidden-when-auth">Sign out</button>
    </header>

    <!-- Auth -->
    <section id="auth-view">
      <p class="lede">Save anything. Search it like you remember it — not by keyword, by meaning.</p>
      <div class="auth-box">
        <input id="email" type="email" placeholder="you@example.com" autocomplete="email" />
        <button id="signin">Send magic link</button>
        <p id="auth-msg" class="muted"></p>
      </div>
    </section>

    <!-- Main -->
    <section id="main-view" class="hidden">
      <div class="save-bar">
        <input id="url-input" type="url" placeholder="Paste a link to save…" />
        <button id="save-btn">Save</button>
      </div>
      <input id="search-input" type="search" placeholder="Search by meaning — “that article about burnout”" />
      <p id="status" class="status"></p>
      <div id="list"></div>
    </section>

    <!-- Paywall -->
    <div id="paywall" class="modal hidden">
      <div class="modal-card">
        <h2>You’ve hit your free limit 🎉</h2>
        <p>You’re clearly using Inbox for real. Go <strong>Pro</strong> for unlimited saves, semantic search across everything, and your weekly digest.</p>
        <a class="cta" href="#pro">Upgrade to Pro</a>
        <button id="close-paywall" class="ghost">Maybe later</button>
      </div>
    </div>
  </div>

  <script>
    // Toggle the sign-out button visibility once auth resolves.
    document.addEventListener("DOMContentLoaded", () => {
      const so = document.getElementById("signout");
      const mv = document.getElementById("main-view");
      new MutationObserver(() => {
        so.style.display = mv.classList.contains("hidden") ? "none" : "inline-block";
      }).observe(mv, { attributes: true, attributeFilter: ["class"] });
      so.style.display = "none";
    });
  </script>
  <!-- config.js (git-ignored) must define window.INBOX_CONFIG before main.js -->
  <script src="./config.js"></script>
  <script type="module" src="./main.js"></script>
</body>
</html>
